services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: job-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - job-net


  # ==========================================================
  # Flask ML Service
  # ==========================================================
  ml-service:
    build:
      context: ./ml-service

    container_name: job-ml-service
    restart: unless-stopped

    ports:
      - "6100:6100"

    networks:
      - job-net


  # ==========================================================
  # Node.js / Express Backend
  # ==========================================================
  backend:
    build:
      context: ./backend

    container_name: job-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}

      ML_SERVICE_URL: ${ML_SERVICE_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

    ports:
      - "5050:5000"

    depends_on:
      postgres:
        condition: service_healthy

      ml-service:
        condition: service_started

    networks:
      - job-net


  # ==========================================================
  # React Frontend
  # ==========================================================
  frontend:
    build:
      context: ./frontend

      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}

    container_name: job-frontend
    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      - backend

    networks:
      - job-net


# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:


# ============================================================
# Network
# ============================================================
networks:
  job-net:
    driver: bridge